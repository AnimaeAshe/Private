<script>
const passages={
  start:{channel:"CH 03 Forestry",title:"Routine Check",mike:"logging",lines:[
    ["static","BEEP-BEEP"],["system","[Incoming transmission]"],
    ["dialogue","Mike","Hey, man! Finished my north-side patrol. All clear. Got lucky tonight—I saw two beautiful deer by the Old Logging Road entrance."],
    ["dialogue","Mike","How's the coffee over there? My thermos is empty, and I'm almost out of crackers. Mind if I grab some when I swing by?"],
    ["dialogue","Base","...Let me check. There's more than half a pot left. Want me to warm it up?"],
    ["dialogue","Mike","Nah, cold coffee works. Keeps you awake. Hey, Sarah said someone at the East Shore campsite asked if she had a lighter."],
    ["dialogue","Sarah","Yeah, but I've already started the truck. I'm heading out. My daughter's school has an open house tomorrow morning, so I can't hang around. The campers are the Harrises, registered at East Shore. They asked for a lighter—their fire's almost out."],
    ["dialogue","Base","Copy. I'll swing by later. I'll save you half the pot. Pour yourself some when you get back."],["dialogue","Mike","You got it, man."]
  ],choices:[{text:"Stay on shift",to:"rescue"}],call:"Mike: Still on my way back, man. And don't drink all that coffee before I get there."},
  rescue:{channel:"CH 07 Public Channel",title:"Distress Call",signal:"▂▂▁",mike:"logging",lines:[
    ["static","BEEP-BEEP"],["system","[Incoming call on the public channel]"],
    ["dialogue","Unknown Caller [panicked woman]","Hello... is this the park emergency channel? Is anyone there?"],["dialogue","Base","I'm here. Go ahead, ma'am."],["dialogue","Unknown Caller [panicked woman]","Please! Help us! Anyone!"],["dialogue","Base","What's happening? Where are you?"],
    ["dialogue","Unknown Caller [rambling woman]","We're... we're at East Shore Campground... something's following us! Oh my God... that's not a normal deer... It's standing at the edge of the woods..."],["dialogue","Unknown Caller [rambling woman]","I ran. My husband, David, went to look at it. I don't know where he is now... God... my flashlight's almost dead—"],["system","[Signal lost]"],["dialogue","Base","Ma'am? Can you hear me?"],["system","[No response]"],["scene","You switch back to the forestry channel."],
    ["dialogue","Base","Mike, we had a distress call from East Shore. A woman got separated from her husband. She said some kind of animal was following them."],["dialogue","Mike","Copy. I'm near the Old Logging Road. I'll take the trail toward East Shore and check it out."],["dialogue","Base","Be careful."],["dialogue","Mike","Copy."],["scene","You switch back to the public channel. A wash of static fills the speaker."],["static","***KSSSHHH***"],
    ["dialogue","Unknown Caller [muffled male voice]","Hello? Can anyone hear me?"],["dialogue","Base","I hear you. Sir, where are you?"],["dialogue","Unknown Caller [muffled male voice]","I'm... near the campground. She's gone. Can you... help me find her?"],["dialogue","Base","Who? Sir... did you say East Shore?"],["dialogue","Unknown Caller [muffled male voice]","Yeah. East Shore. You know the way from the ranger station, right?"],["system","[Signal lost]"],["dialogue","Base","Sir? Repeat your location."],["system","[No further response]"],["scene","You switch back to the forestry channel."],
    ["dialogue","Base","Mike, another guy just called on the public channel. He said he was near East Shore, looking for his wife... Must be that woman's husband. Good. Sounds like they're both okay."],["dialogue","Mike","Oh? That's good news."],["scene","A few minutes later, Mike reaches the campground."],["dialogue","Mike","Man, I'm at East Shore. The tent's still here. The fire's been out for a while. No one's around."],["dialogue","Base","...How can that be? Did they go somewhere else? Do you see their car?"],["dialogue","Mike","It's still by the campsite... That's weird."],["dialogue","Base","Don't go too far. Try following the shoreline. Call in if anything looks off."],["dialogue","Mike","Copy."]

    ["dialogue","Unknown Caller [panicked woman]","Hello... is this the park emergency channel? Is anyone there?"],["dialogue","Base","I'm here. Go ahead, ma'am."],["dialogue","Unknown Caller [panicked woman]","Please! Help us! Anyone!"],["dialogue","Base","What's happening? Where are you?"],["dialogue","Unknown Caller [rambling woman]","We're... we're at East Shore Campground... something's following us! Oh my God... that's not a normal deer... It's standing at the edge of the woods..."],["dialogue","Unknown Caller [rambling woman]","I ran. My husband, David, went to look at it. I don't know where he is now... God... my flashlight's almost dead—"],["system","[Signal lost]"],["dialogue","Base","Ma'am? Can you hear me?"],["system","[End of replay]"],["static","***KSSSHHH***"],["dialogue","Unknown Caller [muffled male voice]","Hello? Can anyone hear me?"],["dialogue","Base","I hear you. Sir, where are you?"],["dialogue","Unknown Caller [muffled male voice]","I'm... near the campground. She's gone. Can you... help me find her?"],["dialogue","Base","Who? Sir... did you say East Shore?"],["dialogue","Unknown Caller [muffled male voice]","Yeah. East Shore. You know the way from the ranger station, right?"],["system","[Signal lost]"],["dialogue","Base","Sir? Repeat your location."],["system","[No further response]"],["system","[End of replay]"]

  park_record:{channel:"CH 03 Forestry",title:"Park Registry",mike:"east",lines:[["scene","Park registry: Elena and David Harris, two people, checked in this afternoon. Their car is still at East Shore Campground."],["scene","Park registry: No other visitors are currently listed in the park."]],choices:[{text:"Return to forestry channel",to:"field_check"}],call:"No response on the public channel. Just silence."},
  field_check:{channel:"CH 03 Forestry",title:"Check the Site",mike:"east",lines:[["dialogue","Base","Mike, what's the situation?"],["dialogue","Mike","I don't see either of the two people you mentioned... Just their tent and a car. The fire's been out for a while."],["dialogue","Base","You're sure no one's there?"],["dialogue","Mike","Positive. No footprints around the campsite. Not that I can see, anyway."],["scene","Mike keeps searching along the shore."]],choices:[{text:"Stay on shift",to:"along_lake"}],call:"Mike: I'm following the shore toward the Old Pier."},
  along_lake:{channel:"CH 03 Forestry",title:"Along the Shore",signal:"▂▂▂",mike:"pier",lines:[["dialogue","Mike","Man, I followed the shore from East Shore to the Old Pier. Still no one. Hang on... I think I see a light by the pier. It's faint."],["dialogue","Base","What is it?"],["dialogue","Mike","Not sure... I'm going to take a look."],["system","[The forestry channel hums with static. Mike's breathing comes and goes.]" ]],choices:[{text:"Keep listening",to:"elena_second"}],call:"Mike: I'm near the Old Pier. No one's here. There was a light a minute ago, but I can't see it now."},
  elena_second:{channel:"CH 07 Public Channel",title:"Elena Calls Again",signal:"▂▁▁",mike:"pier",lines:[["dialogue","Unknown Caller [out-of-breath woman]","...Oh God."],["dialogue","Base","Elena?"],["dialogue","Unknown Caller [out-of-breath woman]","Help me... It just... it just called me in David's voice. It was right nearby. It sounded just like him, but... the way it said my name was wrong. David wouldn't say it like that."],["system","[A distant shout. A man's voice, too muffled to make out.]"],["dialogue","Unknown Caller [out-of-breath woman]","It's back... It's coming back... Oh God..."],["dialogue","Base","Are you hurt?"],["dialogue","Unknown Caller [out-of-breath woman]","...No, but I can't make myself go out there..."],["dialogue","Base","It's okay. We'll help you. Tell me where you are, ma'am."],["dialogue","Unknown Caller [out-of-breath woman]","I'm in the... boathouse by the Old Pier."],["dialogue","Base","Listen to me. Stay where you are. I'll have Mike find you."],["dialogue","Unknown Caller [out-of-breath woman]","...Okay."],["system","[Forestry channel]"],["dialogue","Base","Elena says she's in the boathouse."],["dialogue","Mike","Copy, man... But something's wrong out here. I heard a man calling for help in the woods..."],["dialogue","Base","...Be careful. Find Elena first."],["dialogue","Mike","Sh—"],["system","[A burst of noise. Something heavy hits the ground.]"],["dialogue","Base","Mike? ...Mike?"],["system","[Signal lost]"]],choices:[{text:"Stay on shift",to:"impersonation"}],call:"No response on the public channel. Just silence."},
  impersonation:{channel:"CH 07 Public Channel",title:"Another Call",signal:"▂▁▁",mike:"pier",lines:[["static","***KSSSHHH***"],["dialogue","Mike","Hey, man."],["system","[Static, with a hollow, wind-through-a-cave rasp underneath.]"],["dialogue","Mike [tired, relieved]","...Man, it's me. Bad signal. The channels got crossed."],["dialogue","Base","You okay? What happened?"],["dialogue","Mike","Heh. Too dark out here. I took a spill. I'm fine."],["dialogue","Mike","I found Elena, but something's wrong with the car key. Can you drive down the south road and pick us up?"],["dialogue","Base","Okay. I know the way."],["dialogue","Mike","...Thanks, man. It's been a hell of a night. Come on."],["system","[Signal lost]"]],choices:[{text:"Stay on shift",to:"pier_car"},{text:"Drive out to pick up Mike",to:"ending_one"}],call:"No response on the public channel. Just silence."},
  pier_car:{channel:"CH 03 Forestry",title:"At the Old Pier",signal:"▂▁▁",mike:"pier",lines:[["dialogue","Base","..."],["dialogue","Base","...Mike?"],["dialogue","Base","......"],["dialogue","Base","...Mike. Answer me. I know that wasn't you... Are you still at the Old Pier?"],["system","[A long silence on the channel.]"],["dialogue","Base","Mike."],["system","[Something is picked up off the ground.]"],["dialogue","Mike [very quiet male voice]","...Man, I'm at the Old Pier with Elena. Jesus..."],["dialogue","Base","Are you both okay?"],["dialogue","Mike","...I saw something out there. It was a monster... I dropped the radio when I saw it. Elena spotted me and pulled me into the boathouse by the pier."],["dialogue","Mike","Honestly... I don't know if I'm going to make it. I don't know what that thing is. A person? A giant deer?"],["dialogue","Mike","...I hear footsteps... Man, I don't know if I'm getting out of here alive."],["system","[Heavy footsteps. A branch snaps.]"],["dialogue","Base","Shh. Stay quiet."],["dialogue","Base","Be careful. I'll figure out a way to help you."]],choices:[{text:"Answer on the public channel",to:"branch_one"},{text:"Turn on the lookout tower lights",to:"branch_two"},{text:"Stay on the radio",to:"branch_three"}],call:"Best not. Don't draw its attention."},
  branch_one:{channel:"CH 07 Public Channel",title:"Public Channel",signal:"▂▁▁",mike:"pier",next:"ending_two",lines:[["system","[Public channel]"],["dialogue","Base","Mike?"],["dialogue","Mike","I'm here. What's up, man?"],["dialogue","Base","I'm already on the south road. I'll be at the Old Pier in about ten minutes."],["dialogue","Mike [a brief pause]","...Okay. Hurry."],["dialogue","Base","Have Elena turn on the car lights. I'll follow them to you."],["system","[A long silence settles over the channel.]"],["scene","You watch the screen, waiting for the voice on the other end to react—to move away from the pier."],["dialogue","Mike","..."],["dialogue","Mike [cold, gravelly voice]","You're lying."],["dialogue","Base","...What?"],["dialogue","Mike [cold, gravelly voice]","I can't see any headlights. You're not on the road."],["dialogue","Mike","Ah... I see."],["dialogue","Mike","They're here, aren't they?"],["dialogue","Mike [terrified]","Man! It's coming for us! It's right outside the door! It knows we're here!"],["dialogue","Base","Mike! Run—!"],["system","[Wood splinters.]"],["dialogue","Elena [screaming]","No! Stay back! Aaaah!"],["system","[A wet crunch. Something heavy is dragged across the wooden floor.]"],["system","[In seconds, everything falls silent.]"],["static","***KSSSHHH***"],["dialogue","Unknown Caller [inhuman, low voice]","Wait for me."],["scene","You kill the power, lock the ranger station door, grab the nearest thing you can use to defend yourself, and crawl under the desk."],["static","***KSSSHHH***"],["system","[Signal lost]"]],call:"That would only put Mike in danger."},
branch_two:{channel:"CH 03 Forestry",title:"The Lookout Tower",signal:"▂▂▁",mike:"pier",lines:[["static","***KSSSHHH***"],["dialogue","Base","Mike?"],["dialogue","Mike","I'm here. What's up, man?"],["dialogue","Base","I checked the system. David just tripped the emergency beacon at the lookout tower. I'm driving up there now. I'll be at the tower in a minute."],["dialogue","Mike [a brief pause]","...The lookout tower?"],["dialogue","Base","Yeah. Keep Elena in the car with the doors locked. Don't let her out. I'm at the top now. I'm turning on the spotlight. Look up the hill—see if you can spot him in the beam."],["dialogue","Mike","...Okay. Turn it on."]],choices:[{text:"Route all power to the lookout tower",to:"tower_lit"},{text:"Call Mike back",to:"tower_lie_caught"}],call:"I'm still at the Old Pier. Can you see the spotlight?"},
tower_lie_caught:{channel:"CH 03 Forestry",title:"The Lookout Tower",signal:"▂▁▁",mike:"pier",next:"ending_two",lines:[["scene","[Before you can reach Mike]"],["dialogue","Mike [cold, gravelly voice]","The hill's still dark."],["dialogue","Mike [cold, gravelly voice]","What's taking you so long to turn on the light?"],["dialogue","Mike [cold, gravelly voice]","...You're lying to me."],["system","[An inhuman giggle.]"],["dialogue","Mike [delighted]","I know."],["dialogue","Mike [delighted]","They never left."],["system","[Forestry channel]"],["dialogue","Mike [terrified]","Man! It's charging the boathouse! It never left! Aah—!"],["system","[The boathouse door splinters. Screams burst over the radio, then cut off.]"],["static","***KSSSHHH***"],["dialogue","Mike","Ah... I'll be waiting."]],call:"Mike won't answer again."},
tower_lit:{channel:"CH 03 Forestry",title:"The Lookout Tower",signal:"▂▂▁",mike:"tower",lines:[["system","[You slam the switch down, routing all power to the spotlight.]"],["system","[The lookout's beam snaps on, cutting through the night and sweeping across the trees on the ridge.]"],["dialogue","Base","It's on. Do you see it? I'm right under the beam."],["dialogue","Mike","I'm coming."],["system","[A heavy footfall.]"],["system","[The footsteps recede. You cut the public channel and switch back to forestry as fast as you can.]"],["dialogue","Mike [breathing hard]","Man! You turned on the lookout! It took the bait!"],["dialogue","Mike [breathing hard]","But what about the park's power? That spotlight draws too much. It won't last long."],["dialogue","Base","Listen, Mike. This is our only shot, and we don't have much time."]],choices:[{text:"Have Mike drive Elena back to the ranger station",to:"ending_three"},{text:"Tell Mike and Elena to stay hidden in the boathouse",to:"stay_boathouse"}],call:"Mike: It took the bait, but that spotlight won't hold for long."},
stay_boathouse:{channel:"CH 03 Forestry",title:"The Boathouse",signal:"▂▁▁",mike:"pier",next:"ending_two",lines:[["dialogue","Base","...Driving back is too risky. Stay in the boathouse. Don't make a sound. Don't move."],["dialogue","Mike","Copy."],["scene","Ten minutes pass."],["dialogue","Mike [desperate whisper]","Man... that thing's smarter than we thought."],["dialogue","Mike [desperate whisper]","It's charging down the hill. It's fast! It smashed the spotlight! It's coming back to the pier!"],["dialogue","Base","What?!"],["dialogue","Mike","I'm taking Elena and running—"],["system","[A terrible roar over the channel, followed by the dull, tearing sound of something heavy being ripped apart. Then nothing.]"],["static","***KSSSHHH***"],["system","[Signal lost]"]],call:"Mike won't answer again."},
branch_three:{channel:"CH 07 Public Channel",title:"Outside the Ranger Station",signal:"▂▁▁",mike:"pier",next:"ending_two",lines:[["static","***KSSSHHH***"],["dialogue","Unknown Caller [flat female voice]","Hello? Sir... thank you. I found the trail. I'm at the ranger station now. Can you open the door?"],["scene","You don't answer."],["dialogue","Base","...Elena said she was near the Old Pier. She couldn't have made it to the station this fast."],["dialogue","Unknown Caller [female voice]","I can see the light in there. Open up."],["system","[The channel goes quiet.]"],["dialogue","Unknown Caller [low, gravelly voice]","...You heard me, didn't you?"],["dialogue","Base","..."],["dialogue","Unknown Caller [like wood scraping on wood]","Come down... come outside, and I'll tell you where she is."],["system","[Signal lost]"]],call:"No response on the public channel. Just silence."},
ending_one:{channel:"CH 03 Forestry",title:"The Boathouse",signal:"▂▁▁",mike:"pier",lines:[["scene","You ease the truck down the park road and stop outside the boathouse at the Old Pier. Someone waves through the windshield. A woman stands behind him."],["dialogue","Base","Hey, Mike. You okay?"],["scene","Mike nods. They open the doors and climb in. Elena looks terrified. Before long, she falls asleep."],["dialogue","Base","Mike... what happened? And where's Elena's husband?"],["dialogue","Mike","I don't really know."],["dialogue","Base","Did you see that thing?"],["dialogue","Mike","No. It never made another sound."],["scene","You relax a little and turn your eyes back to the road."],["scene","A little while later, Mike's voice comes over the radio, faint and broken by wind:"],["dialogue","Mike [out of breath]","Man... where are you? ...A huge deer was chasing me... Elena's gone..."],["dialogue","Base","..."],["scene","A strange laugh sounds beside you. You jerk your eyes up to the rearview mirror."],["scene","In the back seat, Mike and Elena are smiling. Their faces bend into the same impossible grin."],["scene","They say,"],["emphasis","Got you..."],["system","[No signal]"]],choices:[{text:"Start the shift over",to:"start",reset:true}]},
ending_two:{channel:"CH 03 Forestry",title:"The Ranger Station",signal:"▂▂▁",mike:null,lines:[["scene","...Oh, no."],["scene","You bolt to the ranger station's steel door and throw the latch into place."],["scene","Click. Locked. You jam the heavy backup bolt into the floor socket."],["scene","You lunge for the control panel and pull the station's main breaker."],["scene","Darkness swallows the room. You grab the heavy flashlight and back into a corner."],["scene","A few minutes later, heavy footsteps stop outside the door."],["system","BANG!"],["scene","Something slams into the steel door from outside. The frame shudders. Dust sifts down."],["system","BANG!"],["scene","Again. Thank God for that heavy door—the one everyone usually complains about."],["scene","For a few seconds, nothing. Then a familiar voice comes through the crack, close and clear."],["dialogue","Mike","It's me, man. It's me. I got away."],["dialogue","Mike","You saved me some coffee, right?"],["dialogue","Mike [weak voice]","Help me... man, open the door... my chest hurts so bad..."],["dialogue","Elena [screaming]","Please! Open up! It's right behind me! Aah—!"],["dialogue","Unknown Caller [low growl]","Open the door!!"],["scene","The pounding slows. Then long fingernails drag across the steel, screeching against the door."],["scene","The sound goes on for hours, until your nerves are ready to snap."],["scene","When the first light slips through the blinds, everything outside falls quiet."],["scene","You sit in the corner, awake all night."],["scene","Morning news: ...State police received a report this morning that two campers and a ranger went missing from Grey Pine National Forest last Sunday. Their campsite was found beside an empty car. Search crews are expected to head out later today. A reminder to all visitors..."],["scene","You keep your eyes on the flat ribbon of highway. You don't look at the park radio on the passenger seat."],["emphasis","...Mike."],["system","[No signal]"]],choices:[{text:"Start the shift over",to:"start",reset:true}]},
ending_three:{channel:"CH 03 Forestry",title:"Back at the Ranger Station",signal:"▂▂▁",mike:"station",lines:[["dialogue","Base","Now! It thinks I'm up on the ridge! Start the truck and get Elena back to the ranger station. Move!"],["dialogue","Base","Keep the headlights off. It seems to react to light."],["dialogue","Mike","Copy!"],["system","[The engine roars over the forestry channel. Tires scrape and spin in the mud. Then the sound fades.]"],["scene","The next ten minutes are the longest of your life. You stand behind the steel door, gripping a heavy crowbar. Your palms are slick with sweat. You keep your eyes on the beam sweeping across the ridge."],["scene","The beam shudders, as if something massive has struck it. A moment later, glass breaks in the distance. The light goes out."],["scene","The thing has figured out the ridge is a decoy."],["scene","It took the bait. Now it knows it was fooled."],["scene","At last, an engine approaches the station. Tires skid to a stop on the gravel."],["scene","You throw the bolt and wrench open the heavy door. Mike nearly drags a limp Elena inside."],["scene","You haul them in and slam the door with your shoulder. The heavy bolt drops into the floor socket with a clank—"],["system","ROOOAAAR!!!"],["scene","A furious scream tears through the forestry channel. The water glass on the desk trembles. The thing has raced down the hill and reached the ranger station."],["scene","Heavy footsteps circle the building. Then long, sharp nails scrape the metal—scritch, scritch—like they're dragging across your skull."],["scene","The blows slow. At last, all you hear is the teeth-rattling scrape of nails trailing down the steel door."],["scene","The sound goes on for hours, until your nerves are ready to snap."],["scene","When the first light slips through the blinds, everything outside falls quiet."],["scene","There isn't a mark by the door. Last night could almost have been a nightmare."],["scene","Mike helps Elena up. She's shaking too hard to speak in full sentences. She says that after David went to look for it, the thing used his voice to talk to her for a long time. David never came back."],["scene","You call the police and warn the ranger coming on for the morning shift."],["scene","At last, it's over. You drive home. Just as you reach for the truck radio..."],["scene","The spare handheld on the passenger seat switches on by itself."],["system","┌── PARK PUBLIC CHANNEL ── CH 07 SIGNAL ▂▁▁ ──┐"],["static","***KSSSHHH***"],["emphasis","[No words. A low, deep-throated sound, like something breathing through its teeth. It lasts about ten seconds, then cuts out.]"],["scene","Your hands lock on the wheel. In the rearview mirror, the road through the trees is empty."],["system","[No signal]"]],choices:[{text:"Don't go back there... if you can help it.",to:"start",reset:true}]}

let current="start",history=[],activeChannel="CH 03 Forestry",logEl=document.getElementById("log"),visibleLines=[],lineIndex=0,typingTimer=null,typingState=null;
function safe(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function speakerName(name){return String(name).replace(/\s*\[[^\]]*\]\s*/g,"").trim()}
function voiceCue(name){const note=(String(name).match(/\[([^\]]+)\]/)||[])[1]||"";return note}
function splitLines(lines){const result=[];for(const row of lines){if(row[0]==="dialogue"){const parts=row[2].match(/[^.!?]+(?:[.!?]+|$)/g)||[row[2]];for(const part of parts)if(part.trim())result.push(["dialogue",speakerName(row[1]),part.trim(),voiceCue(row[1])])}else{const clean=String(row[1]).trim();if(clean)result.push([row[0],clean])}}return result}
function finishTyping(){if(!typingState)return;clearTimeout(typingTimer);typingTimer=null;const state=typingState;state.target.textContent=state.text;typingState=null;logEl.scrollTop=logEl.scrollHeight;if(state.done)state.done()}
function typeText(target,text,done){if(window.matchMedia("(prefers-reduced-motion: reduce)").matches){target.textContent=text;if(done)done();return}const chars=Array.from(text);let i=0;typingState={target,text,done};const tick=()=>{if(!typingState)return;target.textContent=chars.slice(0,++i).join("");logEl.scrollTop=logEl.scrollHeight;if(i<chars.length){const ch=chars[i-1];typingTimer=setTimeout(tick,/[,;:…]/.test(ch)?72:24)}else finishTyping()};tick()}
function appendLine(row,done){const [type,a,b,c]=row;const p=document.createElement("p");p.className="line "+(type==="dialogue"?"speaker":type);let textTarget;if(type==="dialogue"){const cue=c?"["+String(c).replace(/^\[|\]$/g,"")+"]":"";p.innerHTML='<span class="speaker-label"><span class="name">'+safe(a)+'</span>'+(cue?'<span class="voice-note">'+safe(cue)+'</span>':'')+'</span><span class="dialogue"></span>';textTarget=p.querySelector(".dialogue")}else{textTarget=p}logEl.appendChild(p);logEl.scrollTop=logEl.scrollHeight;typeText(textTarget,type==="dialogue"?b:a,done)}
function renderChoices(list){document.getElementById("choices").innerHTML=list.map((c,i)=>'<button class="choice" data-i="'+i+'">'+safe(c.text)+'</button>').join("");document.querySelectorAll(".choice").forEach(btn=>btn.addEventListener("click",()=>{let c=list[Number(btn.dataset.i)];if(c.reset)history=[];render(c.to)}))}
function advance(){if(typingState){finishTyping();return}const next=document.getElementById("nextline");if(next)next.remove();const p=passages[current];if(lineIndex<visibleLines.length){const row=visibleLines[lineIndex++],hasMore=lineIndex<visibleLines.length,hasChoices=(p.choices||[]).length>0,hasNext=!!p.next;if(hasMore||hasChoices||hasNext){const b=document.createElement("button");b.id="nextline";b.className="nextline";b.textContent="▶ NEXT";b.onclick=advance;logEl.appendChild(b)}appendLine(row,()=>{const button=document.getElementById("nextline");if(hasMore){if(button)button.textContent="▶ NEXT"}else if(hasChoices){if(button)button.remove();renderChoices(p.choices)}else if(hasNext){if(button)button.textContent="▶ CONTINUE"}else if(button)button.remove()});logEl.scrollTop=logEl.scrollHeight;return}if(p.next)render(p.next)}
function render(key,record=true){if(typingState)finishTyping();if(record&&current!==key)history.push(current);current=key;const p=passages[key];document.getElementById("channel").textContent=p.channel;document.getElementById("screen-status").textContent=p.channel.includes("Public")?"Public Channel · Monitoring":"Forestry Channel · Monitoring";activeChannel=p.channel;const titleEl=document.getElementById("title"),endingTitles={ending_one:"Ending 1",ending_two:"Ending 2",ending_three:"Ending 3"};titleEl.textContent=endingTitles[key]||(p.channel.includes("Public")?"Public Channel":"Forestry Channel");titleEl.hidden=false;document.getElementById("signal").textContent=p.signal||"▂▂▂";document.getElementById("mike-marker").className="marker mike"+(p.mike?" active":"");let coords={logging:[82,22],east:[86,42],pier:[87,61],tower:[54,9],station:[13,81]};if(p.mike&&coords[p.mike]){let [x,y]=coords[p.mike];let m=document.getElementById("mike-marker");m.style.left=x+"%";m.style.top=y+"%"}document.getElementById("player-marker").classList.toggle("active",!key.startsWith("ending"));logEl.innerHTML="";document.getElementById("choices").innerHTML="";visibleLines=splitLines(p.lines);lineIndex=0;advance()}
function modal(title,body){document.getElementById("modal-title").textContent=title;document.getElementById("modal-content").innerHTML="<p>"+safe(body)+"</p>";document.getElementById("modal").classList.add("open")}
document.getElementById("close-modal").onclick=()=>document.getElementById("modal").classList.remove("open");document.getElementById("modal").onclick=e=>{if(e.target.id==="modal")e.currentTarget.classList.remove("open")};
document.getElementById("replay").onclick=()=>{if(!history.length){modal("Replay Last","No earlier transmission to replay.");return}const p=passages[history[history.length-1]];modal("Replay | "+p.title,p.lines.map(x=>x[0]==="dialogue"?speakerName(x[1])+": "+x[2]:String(x[1])).join("\n"))};
document.getElementById("call").onclick=()=>{const p=passages[current];modal("Call Partner | CH 03",p.call||"No answer. Only static on the radio.")};
