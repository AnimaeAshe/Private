  <dialog class="viewer" aria-label="Artwork viewer">
    <div class="viewer-bar"><span>Character folio</span><button class="viewer-close" type="button" aria-label="Close artwork">Close ✕</button></div>
    <img alt="Expanded artwork">
  </dialog>
  <script>
    const viewer = document.querySelector('.viewer');
    const viewerImage = viewer.querySelector('img');
    document.querySelectorAll('[data-image]').forEach((button) => button.addEventListener('click', () => {
      viewerImage.src = button.dataset.image;
      viewer.showModal();
    }));
    viewer.querySelector('.viewer-close').addEventListener('click', () => viewer.close());
    viewer.addEventListener('click', (event) => { if (event.target === viewer) viewer.close(); });
  </script>
